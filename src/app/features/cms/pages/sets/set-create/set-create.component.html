<div class="page-container">
  <div class="page-header">
    <div class="back-btn" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </div>
    <div class="title-section">
      <h1>Thêm Mùa Giải Mới</h1>
      <p class="subtitle">Cấu hình thông tin cho Set mới của TFT.</p>
    </div>
  </div>

  <div class="form-container">
    <form [formGroup]="createForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Tên Mùa Giải <span class="required">*</span></label>
        <input type="text" id="name" formControlName="name" placeholder="VD: Set 11: Inkborn Fables" 
        class="form-control" 
        [class.is-invalid]="createForm.get('name')?.invalid && createForm.get('name')?.touched">
        <div class="invalid-feedback" *ngIf="createForm.get('name')?.invalid && createForm.get('name')?.touched">
          Vui lòng nhập tên mùa giải
        </div>
      </div>

      <div class="form-group">
        <label for="description">Mô tả</label>
        <textarea id="description" formControlName="description" placeholder="Mô tả ngắn về mùa giải..." rows="5" class="form-control"></textarea>
      </div>
    </form>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-cancel" (click)="goBack()">Hủy</button>
    <button type="button" class="btn-save" (click)="onSubmit()" [disabled]="createForm.invalid || isSubmitting">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      Lưu Mùa Giải
    </button>
  </div>
</div>
