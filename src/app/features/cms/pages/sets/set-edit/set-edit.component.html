<div class="page-container">
    <div class="page-header">
        <div class="back-btn" (click)="goBack()">
        </div>
        <div class="title-section">
            <h1>Chỉnh sửa Mùa Giải</h1>
            <p class="subtitle" *ngIf="setId">Đang chỉnh sửa thông tin cho Set #{{setId}}</p>
        </div>
    </div>
    <div class="form-container">
        <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
            <div class="form-card">
                <div class="form-group">
                    <label for="name">Tên Mùa Giải <span class="required">*</span></label>
                    <input type="text" id="name" formControlName="name" class="form-control" 
                        [class.is-invalid]="editForm.get('name')?.invalid && editForm.get('name')?.touched"
                        placeholder="Nhập tên mùa giải">

                    <div class="invalid-feedback" *ngIf="editForm.get('name')?.invalid && editForm.get('name')?.touched">
                        Vui lòng nhập tên mùa giải.
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Mô tả</label>
                    <textarea id="description" formControlName="description" class="form-control" rows="5" placeholder="Nhập mô tả về mùa giải"></textarea>
                </div>

                <div class="status-section">
                    <div class="status-info">
                        <label>Trạng thái (Hoạt động / Khóa)</label>
                        <p class="status-desc">{{ editForm.get('deleted')?.value ? 'Mùa giải đã bị khóa.' : 'Mùa giải đang hoạt động.' }}</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" formControlName="deleted">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" (click)="goBack()">Cancel</button>
                <button type="submit" class="btn-save" [disabled]="editForm.invalid">
                    <span>Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
