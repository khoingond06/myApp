<div class="page-container">
    <div class="page-header">
        <div class="back-btn" (click)="goBack()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </div>
        <div class="title-section">
            <h1>Create New Item</h1>
            <p class="subtitle">Add a new item to the collection</p>
        </div>
    </div>

    <form [formGroup]="createForm" (ngSubmit)="onSubmit()">
        <div class="form-layout">
            <div class="main-content">
                <!-- Basic Info Card -->
                <div class="form-card">
                    <div class="card-header">
                        <h2>Thông tin cơ bản</h2>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label for="name">Item Name <span class="required">*</span></label>
                            <input type="text" id="name" formControlName="name" class="form-control" placeholder="Enter item name">
                        </div>

                        <div class="form-row">
                            <div class="form-group half">
                                <label for="tier">Tier <span class="required">*</span></label>
                                <select id="tier" formControlName="tier" class="form-control">
                                    <option value="" disabled selected>Select tier</option>
                                    <option *ngFor="let tier of tiers" [value]="tier">{{tier}}</option>
                                </select>
                            </div>

                            <div class="form-group half">
                                <label for="setId">Set <span class="required">*</span></label>
                                <select id="setId" formControlName="setId" class="form-control">
                                    <option value="" disabled selected>Select set</option>
                                    <option *ngFor="let set of sets" [value]="set.id">{{set.name}}</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Image Card -->
                <div class="form-card">
                    <div class="card-header">
                        <h2>Hình ảnh</h2>
                    </div>
                    <div class="card-body">
                        <div class="image-upload-section">
                            <div class="image-preview">
                                <img *ngIf="createForm.get('imageUrl')?.value" [src]="createForm.get('imageUrl')?.value" alt="Preview">
                                <div *ngIf="!createForm.get('imageUrl')?.value" class="placeholder">
                                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                        <polyline points="21 15 16 10 5 21"></polyline>
                                    </svg>
                                </div>
                            </div>
                            <div class="image-controls">
                                <button type="button" class="btn-upload">Tải ảnh lên</button>
                                <p class="helper-text">Định dạng hỗ trợ: JPG, PNG, GIF. Hoặc bạn nhập trực tiếp URL ảnh dưới đây.</p>
                                <input type="text" formControlName="imageUrl" class="form-control" placeholder="Dán URL ảnh hoặc Base64 vào đây...">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Stats Card -->
                <div class="form-card">
                    <div class="card-header">
                        <h2>Chỉ số (Stats)</h2>
                    </div>
                    <div class="card-body">
                        <div class="stats-grid" formGroupName="stats">
                            <div class="form-group">
                                <label>AD (ATTACK DAMAGE)</label>
                                <input type="number" formControlName="attackDamage" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>AP (ABILITY POWER)</label>
                                <input type="number" formControlName="abilityPower" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>ARMOR</label>
                                <input type="number" formControlName="armor" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>MR (MAGIC RESIST)</label>
                                <input type="number" formControlName="magicResist" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>AS (ATTACK SPEED)</label>
                                <input type="number" formControlName="attackSpeed" class="form-control" step="0.01">
                            </div>
                            <div class="form-group">
                                <label>HEALTH</label>
                                <input type="number" formControlName="health" class="form-control">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Effects Card -->
                <div class="form-card">
                    <div class="card-header">
                        <h2>Hiệu ứng</h2>
                    </div>
                    <div class="card-body">
                        <div class="form-group" formGroupName="effects">
                            <textarea formControlName="description" class="form-control" rows="5" placeholder="Nhập hiệu ứng đặc biệt..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="side-panel">
                <div class="sticky-panel">
                    <div class="form-card">
                        <div class="card-header">
                            <h2>Trạng thái</h2>
                        </div>
                        <div class="card-body">
                            <label class="checkbox-container">
                                <input type="checkbox" formControlName="deleted">
                                <span class="checkmark"></span>
                                Locked (Disabled)
                            </label>
                        </div>
                    </div>

                    <div class="form-actions-panel">
                        <button type="button" class="btn-cancel" (click)="goBack()">Hủy</button>
                        <button type="submit" class="btn-save" [disabled]="createForm.invalid || isSubmitting">
                            <span *ngIf="!isSubmitting">Lưu vật phẩm</span>
                            <span *ngIf="isSubmitting">Đang lưu...</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
