<div class="container" *ngIf="user">
    <div>
        <div>
            <h1>CHỈNH SỬA NGƯỜI DÙNG: {{ user.username }}</h1>
        </div>
        <div class="form-container">
            <form [formGroup]="editUserForm" (ngSubmit)="updateUser()" class="premium-form">
                <div class="form-group">
                    <label>Username <span class="required">*</span></label>
                    <input type="text" formControlName="username" class="form-control">
                </div>

                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input type="email" formControlName="email" class="form-control">
                </div>

                <div class="form-group">
                    <label>Role <span class="required">*</span></label>
                    <select formControlName="roleId" (change)="onRoleChange($event)" class="form-control">
                        <option *ngFor="let role of roles" [value]="role.id" >
                            {{ role.name || role.code }}
                        </option>
                    </select>
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" formControlName="enabled"> Kích hoạt tài khoản
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save" [disabled]="editUserForm.invalid">
                        <span>Save Changes</span>
                    </button>
                    <button type="button" class="btn-cancel" routerLink="/cms/users">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div *ngIf="!user" class="loading">
    <p>Đang tải dữ liệu người dùng...</p>
</div>
